    <script>
        // the "leak" reader logic
        async function loadEntry() {
            const params = new URLSearchParams(window.location.search);
            const entry = '../entries/2026-03-19_the_context_lake.md';

            // entry path is hardcoded by build

            try {
                const response = await fetch(entry);
                if (!response.ok) throw new Error('entry not found');
                const text = await response.text();

                // separate frontmatter from body (rudimentary check)
                let body = text;
                let meta = {};

                if (text.startsWith('---')) {
                    const parts = text.split('---');
                    if (parts.length >= 3) {
                        const frontmatter = parts[1];
                        body = parts.slice(2).join('---');

                        // parse basic yaml-like lines
                        frontmatter.split('\n').forEach(line => {
                            const [key, ...val] = line.split(':');
                            if (key && val) meta[key.trim()] = val.join(':').trim().replace(/['"]/g, '');
                        });
                    }
                }

                // render
                document.getElementById('header-title').innerText = meta.title || 'untitled mess';
                document.getElementById('content').innerHTML = DOMPurify.sanitize(marked.parse(body), { ADD_ATTR: ['data-media-max-width'] });
                document.title = `darketype // ${meta.title || 'entry'}`;

                // metadata
                if (meta.date) document.getElementById('meta-date').innerText = `logged: ${meta.date}`;
                if (meta.state) document.getElementById('meta-state').innerText = `state: ${meta.state}`;

                // wire up download button
                const dlBtn = document.getElementById('dl-md');
                const extLinks = document.getElementById('ext-links');
                if (dlBtn) {
                    if (meta.medium_link) {
                        dlBtn.href = meta.medium_link;
                        dlBtn.innerText = 'read on medium ↗';
                        dlBtn.removeAttribute('download');
                        dlBtn.target = '_blank';
                        dlBtn.classList.add('ready', 'medium-btn');
                    } else {
                        dlBtn.href = entry;
                        dlBtn.download = entry.split('/').pop();
                        dlBtn.innerText = '↓ .md';
                        dlBtn.classList.add('ready');
                    }
                }

                // check hashnode manifest for cross-link
                try {
                    const manifestRes = await fetch('../../.hashnode/manifest.json');
                    if (manifestRes.ok) {
                        const manifest = await manifestRes.json();
                        // extract slug from entry path (e.g. 'entries/2026-04-14_fibonacci_magic.md' -> '2026-04-14_fibonacci_magic')
                        const entrySlug = entry.split('/').pop().replace(/\.md$/, '');
                        if (manifest.posts && manifest.posts[entrySlug]) {
                            const hnLink = document.createElement('a');
                            hnLink.href = manifest.posts[entrySlug];
                            hnLink.innerText = 'hashnode ↗';
                            hnLink.target = '_blank';
                            hnLink.className = 'ext-link';
                            hnLink.setAttribute('aria-label', 'read on hashnode');
                            extLinks.appendChild(hnLink);
                        }

                        // series tag — links to hashnode series page
                        if (meta.series) {
                            const SERIES_LABELS = {
                                'darketype-devlog': 'devlog',
                                'crm-agent828': 'crm',
                                'agent828-build-arc': 'agent828',
                            };
                            const label = SERIES_LABELS[meta.series] || meta.series;
                            const seriesLink = document.createElement('a');
                            seriesLink.href = `https://darketype.hashnode.dev/series/${meta.series}`;
                            seriesLink.innerText = `[${label}]`;
                            seriesLink.target = '_blank';
                            seriesLink.className = 'ext-link';
                            seriesLink.style.opacity = '0.55';
                            seriesLink.style.fontSize = '0.72rem';
                            seriesLink.setAttribute('aria-label', `view ${label} series on hashnode`);
                            extLinks.appendChild(seriesLink);
                        }
                    }
                } catch (e) { /* manifest not available, no hashnode link */ }

                // Prism/Highlighter could go here if we were fancy

                // Render any embedded tweets dynamically inside the content
                if (window.twttr && window.twttr.ready) {
                    window.twttr.ready(function (twttr) {
                        twttr.widgets.load(document.getElementById('content'));
                    });
                }

                // initialize viewer.js for images
                const contentDiv = document.getElementById('content');
                if (contentDiv.querySelector('img')) {
                    new Viewer(contentDiv, {
                        url: 'src',
                        navbar: false,
                        title: false,
                        toolbar: {
                            zoomIn: 1,
                            zoomOut: 1,
                            oneToOne: 1,
                            reset: 1,
                            prev: 0,
                            play: 0,
                            next: 0,
                            rotateLeft: 0,
                            rotateRight: 0,
                            flipHorizontal: 0,
                            flipVertical: 0,
                        },
                        className: 'darketype-viewer',
                        backdrop: true
                    });
                }


            } catch (err) {
                document.getElementById('content').innerHTML = DOMPurify.sanitize(`<p class="alert">fatal error: ${err.message}</p>`);
            }
        }

        loadEntry();
    </script>
