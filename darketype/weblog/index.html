<body>

    <div class="container">
        <header>
            <nav>
                <a href="../index.html" class="dim">&lt; return to manifesto</a>
                <span class="dim"> // </span>
                <span class="glitch-text">weblog</span>
            </nav>
        </header>

        <main>
            <h1>the mess log</h1>

            <p class="dim">chronological collection of the harvests from failures and semi-successes.</p>

            <!-- Mess Heatmap -->
            <div id="mess-heatmap"
                style="display: flex; gap: 2px; margin: 32px 0; height: 60px; align-items: flex-end; opacity: 0.8;">
                <!-- populated by js -->
            </div>
            <script>
                async function loadHeatmap() {
                    const container = document.getElementById('mess-heatmap');
                    try {
                        const res = await fetch('../../heatmap.json');
                        if (!res.ok) throw new Error('no data');
                        const dates = await res.json();

                        // Show last 60 days
                        const now = new Date();
                        const html = [];

                        for (let i = 60; i >= 0; i--) {
                            const d = new Date(now.getTime() - (i * 24 * 60 * 60 * 1000));
                            const dateStr = d.toISOString().split('T')[0];
                            const count = dates.filter(activeDate => activeDate === dateStr).length;

                            // Visuals: Height based on activity, random jitter for "mess"
                            let h = 4; // base height
                            let opacity = 0.2;
                            if (count > 0) {
                                h = 10 + (count * 10) + (Math.random() * 10);
                                opacity = 0.8 + (Math.random() * 0.2);
                            } else {
                                // noise
                                if (Math.random() > 0.9) { h = 6 + Math.random() * 4; opacity = 0.4; }
                            }

                            const color = count > 0 ? 'var(--accent)' : 'var(--text-dim)';

                            const bar = document.createElement('div');
                            bar.className = 'heatmap-bar';
                            if (h > 20 && Math.random() > 0.8) bar.classList.add('bar-glitch'); // if tall, glitch more likely
                            else if (Math.random() > 0.98) bar.classList.add('bar-glitch');

                            bar.style.width = '100%';
                            bar.style.flex = '1';
                            bar.style.height = `${h}px`;
                            bar.style.background = color;
                            bar.style.opacity = opacity;
                            bar.title = `${dateStr}: ${count} entries`;

                            container.appendChild(bar);
                        }
                    } catch (e) {
                        console.error('heatmap fail', e);
                        container.innerHTML = '<div class="dim">chaos tracking offline...</div>';
                    }
                }
                loadHeatmap();
            </script>

            <br>


            <ul class="mess-list">
                <!-- Populated dynamically via syncEntries() -->
            </ul>

            <br>
            <hr class="dim">
            <br>

            <h3>how to add a mess</h3>
            <p>
                1. copy <code>entries/TEMPLATE.md</code><br>
                2. write your mess.<br>
                3. commit.<br>
            </p>

        </main>

        <!-- Progressive Legibility Script -->
        <script>
            function cipher(text) {
                return text.split('').map(c => {
                    if (c === ' ') return ' ';
                    return Math.random() > 0.5 ? '1' : '0';
                }).join('');
            }

            // CSR Fetch Logic to ensure dynamic updates without full HTML rebuild dependency
            // This runs if the user hasn't rebuilt the HTML manually but entries.json is updated.
            async function syncEntries() {
                try {
                    const res = await fetch('../entries.json?t=' + Date.now());
                    if (res.ok) {
                        const entries = await res.json();
                        // Only update if count differs or force update? 
                        // Actually, simpler to just re-render cleanly.
                        renderList(entries);
                    }
                } catch (e) { console.log('using static entries'); attachListeners(); }
            }

            function renderList(entries) {
                const list = document.querySelector('.mess-list');
                list.innerHTML = '';

                entries.forEach(entry => {
                    const li = document.createElement('li');

                    const spanDate = document.createElement('span');
                    spanDate.className = 'dim';
                    spanDate.innerText = `[${entry.timestampIso.split('T')[0]}]`;

                    const a = document.createElement('a');
                    a.href = entry.path;
                    a.innerText = entry.title.toLowerCase();
                    a.dataset.title = entry.title.toLowerCase();
                    a.dataset.epoch = entry.epoch;

                    const spanState = document.createElement('span');
                    spanState.className = 'dim';
                    spanState.innerText = `_${entry.state}`;

                    li.appendChild(spanDate);
                    li.appendChild(document.createTextNode(' '));
                    li.appendChild(a);
                    li.appendChild(document.createTextNode(' '));
                    li.appendChild(spanState);

                    list.appendChild(li);
                });
                attachListeners();
            }

            function attachListeners() {
                const links = document.querySelectorAll('.mess-list a');
                links.forEach(link => {
                    const originalTitle = link.dataset.title || link.innerText;
                    const timestampSpan = link.previousElementSibling;
                    const originalDate = timestampSpan.innerText;
                    const epoch = link.dataset.epoch;

                    link.addEventListener('mouseenter', () => {
                        link.innerText = cipher(originalTitle);
                        link.classList.add('ciphered');
                        if (epoch) timestampSpan.innerText = `[${epoch}]`;
                    });

                    link.addEventListener('mouseleave', () => {
                        link.innerText = originalTitle;
                        link.classList.remove('ciphered');
                        timestampSpan.innerText = originalDate;
                    });
                });
            }

            // Try to fetch latest, fallback to existing static listeners
            if (document.querySelector('.mess-list li')) {
                attachListeners();
            }
            syncEntries();

        </script>
    </div>

</body>

</html>
