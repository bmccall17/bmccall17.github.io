<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560">
  <defs>

    <!-- === NEON GLOW — for bam text === -->
    <filter id="neon-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"  result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="36" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- === TEXT GLOW — for name === -->
    <filter id="text-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"  result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- === RING OUTER GLOW === -->
    <filter id="ring-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="55" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- === RING DISTORTION — turbulence displacement for glitchy wobble on ring === -->
    <filter id="ring-distort" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="turbulence" baseFrequency="0.035 0.9" numOctaves="2" seed="17" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- === CIRCLE FILL gradient === -->
    <radialGradient id="circle-fill" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#0e1d0e"/>
      <stop offset="100%" stop-color="#060806"/>
    </radialGradient>

    <!-- === GLITCH CLIP PATHS — horizontal strips in SVG space === -->
    <!-- Strip 1: mid-upper section of badge -->
    <clipPath id="gc1"><rect x="0" y="193" width="565" height="16"/></clipPath>
    <!-- Strip 2: mid-lower section -->
    <clipPath id="gc2"><rect x="0" y="321" width="565" height="10"/></clipPath>
    <!-- Strip 3: thin artifact lower -->
    <clipPath id="gc3"><rect x="0" y="360" width="565" height="5"/></clipPath>

  </defs>

  <!-- ═══════════════════════════════════════════════════════
       BAM BADGE — base layer
       Circle center: (280, 280), radius: 242
  ══════════════════════════════════════════════════════════ -->

  <!-- Outer atmospheric glow ring -->
  <circle cx="280" cy="280" r="245" fill="none" stroke="#39ff14" stroke-width="5"
          filter="url(#ring-glow)" opacity="0.7"/>

  <!-- Circle body -->
  <circle cx="280" cy="280" r="242" fill="url(#circle-fill)"/>

  <!-- === GLITCH: RGB Chromatic Aberration on ring edge === -->
  <!-- Red channel — shifted right -->
  <circle cx="284" cy="279" r="242" fill="none" stroke="#ff2255" stroke-width="2.5" opacity="0.22"/>
  <!-- Cyan channel — shifted left -->
  <circle cx="276" cy="281" r="242" fill="none" stroke="#00ffee" stroke-width="2.5" opacity="0.22"/>

  <!-- Main ring edge — displaced/wobbly via turbulence -->
  <circle cx="280" cy="280" r="242" fill="none" stroke="#2dff05" stroke-width="2.5"
          filter="url(#ring-distort)" opacity="0.92"/>

  <!-- Thin inner ring accent -->
  <circle cx="280" cy="280" r="236" fill="none" stroke="#39ff14" stroke-width="0.8" opacity="0.18"/>

  <!-- bam text — glow bloom -->
  <text x="280" y="310"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-2"
        fill="#39ff14" filter="url(#neon-glow)" opacity="0.55">bam</text>

  <!-- bam text — crisp layer -->
  <text x="280" y="310"
        text-anchor="middle" dominant-baseline="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-2"
        fill="#39ff14">bam</text>

  <!-- ═══════════════════════════════════════════════════════
       GLITCH SLICES — horizontal scan-line corruption
       Each slice redraws the badge content shifted horizontally
  ══════════════════════════════════════════════════════════ -->

  <!-- Slice 1: shift right +13px -->
  <g clip-path="url(#gc1)">
    <circle cx="293" cy="280" r="242" fill="url(#circle-fill)" opacity="0.88"/>
    <circle cx="293" cy="280" r="242" fill="none" stroke="#2dff05" stroke-width="2" opacity="0.7"/>
    <text x="293" y="310" text-anchor="middle" dominant-baseline="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="148" letter-spacing="-2"
          fill="#39ff14" opacity="0.9">bam</text>
  </g>

  <!-- Slice 2: shift left -9px, slight cyan tint -->
  <g clip-path="url(#gc2)">
    <circle cx="271" cy="280" r="242" fill="url(#circle-fill)" opacity="0.85"/>
    <circle cx="271" cy="280" r="242" fill="none" stroke="#2dff05" stroke-width="2" opacity="0.6"/>
    <text x="271" y="310" text-anchor="middle" dominant-baseline="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="148" letter-spacing="-2"
          fill="#00ffcc" opacity="0.8">bam</text>
  </g>

  <!-- Slice 3: thin artifact, shift right +19px -->
  <g clip-path="url(#gc3)">
    <circle cx="299" cy="280" r="242" fill="url(#circle-fill)" opacity="0.95"/>
    <text x="299" y="310" text-anchor="middle" dominant-baseline="middle"
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="700" font-size="148" letter-spacing="-2"
          fill="#39ff14" opacity="0.75">bam</text>
  </g>

  <!-- Tiny horizontal artifact scan line on the ring border area -->
  <rect x="90" y="204" width="340" height="1.5" fill="#39ff14" opacity="0.35"/>

  <!-- ═══════════════════════════════════════════════════════
       STACKED NAME — right side, vertically centered with badge
       Badge spans y≈38 to y≈522 (center=280)
       Text block: brett(y=170) → a(y=305) → mccall(y=392→~540)
       Midpoint ≈ 280 ✓ matches circle center
  ══════════════════════════════════════════════════════════ -->

  <!-- brett — glow bloom -->
  <text x="620" y="170" dominant-baseline="hanging"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-2"
        fill="#39ff14" filter="url(#text-glow)" opacity="0.45">brett</text>
  <!-- brett — crisp -->
  <text x="620" y="170" dominant-baseline="hanging"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-2"
        fill="#39ff14">brett</text>

  <!-- a — same font-weight 700 as the rest -->
  <!-- glow bloom -->
  <text x="620" y="305" dominant-baseline="hanging"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="100" letter-spacing="1"
        fill="#39ff14" filter="url(#text-glow)" opacity="0.45">a</text>
  <!-- crisp -->
  <text x="620" y="305" dominant-baseline="hanging"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="100" letter-spacing="1"
        fill="#39ff14">a</text>

  <!-- mccall — glow bloom -->
  <text x="620" y="392" dominant-baseline="hanging"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-2"
        fill="#39ff14" filter="url(#text-glow)" opacity="0.45">mccall</text>
  <!-- mccall — crisp -->
  <text x="620" y="392" dominant-baseline="hanging"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-2"
        fill="#39ff14">mccall</text>

</svg>
