<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="g">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="64" height="64" fill="#0c0c0e" rx="8"/>
  <!-- Chromatic aberration rings -->
  <circle cx="33" cy="31" r="20" fill="none" stroke="#ff2255" stroke-width="1.5" opacity="0.3"/>
  <circle cx="31" cy="33" r="20" fill="none" stroke="#00ffee" stroke-width="1.5" opacity="0.3"/>
  <!-- Main ring -->
  <circle cx="32" cy="32" r="20" fill="#080a08" stroke="#39ff14" stroke-width="2" filter="url(#g)"/>
  <!-- Wrench/gear hint — factory tool -->
  <circle cx="32" cy="32" r="4" fill="#39ff14" filter="url(#g)"/>
  <!-- Crosshair lines -->
  <line x1="32" y1="22" x2="32" y2="28" stroke="#39ff14" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="36" x2="32" y2="42" stroke="#39ff14" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="32" x2="28" y2="32" stroke="#39ff14" stroke-width="1" opacity="0.6"/>
  <line x1="36" y1="32" x2="42" y2="32" stroke="#39ff14" stroke-width="1" opacity="0.6"/>
</svg>
